name: Release

on:
  push:
    branches: [main]

env:
  GIT_CLIFF_VERSION: '2.10.1'

permissions:
  contents: write

jobs:
  # Debounce: hold the release open for a quiet window so a burst of
  # merges coalesces. Each new push to main cancels the previous run's
  # timer (cancel-in-progress on the shared group) and starts its own,
  # so releases are cut only once main has been quiet for the full
  # window. A surviving run's triggering SHA is therefore the tip of
  # main — any newer push would have cancelled it.
  debounce:
    # Skip release commits. Load-bearing with BOT_TOKEN: unlike
    # GITHUB_TOKEN, its pushes trigger workflows, so the release
    # commit push would otherwise start another run.
    if: ${{ !startsWith(github.event.head_commit.message, 'release(') && !startsWith(github.event.head_commit.message, 'release:') }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-debounce
      cancel-in-progress: true
    steps:
      - name: Wait for quiet window
        run: sleep 300 # Per-project knob: debounce window (seconds)

  verify:
    needs: debounce
    uses: ./.github/workflows/verify.yaml

  generate:
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      has_releases: ${{ steps.metadata.outputs.has_releases }}
      release_tags: ${{ steps.metadata.outputs.release_tags }}
      release_json: ${{ steps.metadata.outputs.release_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Environment
        uses: oven-sh/setup-bun@v2
      - name: Install git-cliff
        uses: actions/cache@v4
        id: cliff-cache
        with:
          path: /usr/local/bin/git-cliff
          key: git-cliff-${{ env.GIT_CLIFF_VERSION }}-${{ runner.os }}
      - name: Download git-cliff
        if: steps.cliff-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
      - name: Dependencies
        run: make deps
      - name: Release Metadata
        id: metadata
        run: make release/github_actions

  tag:
    needs: generate
    if: needs.generate.outputs.has_releases == 'true'
    runs-on: ubuntu-latest
    # Never cancel a release that is already being cut; a push landing
    # in the narrow window after a debounce expires waits here instead.
    concurrency:
      group: release-cut
      cancel-in-progress: false
    outputs:
      pushed: ${{ steps.push.outputs.pushed }}
      release_tags: ${{ needs.generate.outputs.release_tags }}
      release_json: ${{ needs.generate.outputs.release_json }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          # BOT_TOKEN (admin PAT): bypasses the required status checks
          # on main, which reject pushes from GITHUB_TOKEN.
          token: ${{ secrets.BOT_TOKEN }}
      - name: Environment
        uses: oven-sh/setup-bun@v2
      - name: Install git-cliff
        uses: actions/cache@v4
        id: cliff-cache
        with:
          path: /usr/local/bin/git-cliff
          key: git-cliff-${{ env.GIT_CLIFF_VERSION }}-${{ runner.os }}
      - name: Download git-cliff
        if: steps.cliff-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
      - name: Dependencies
        run: make deps
      - name: Import GPG
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          git_user_signingkey: true
          git_commit_gpgsign: true
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
      - name: Configure Git
        run: |
          git config commit.gpgsign true
          git config tag.gpgsign true
          git config user.signingkey "${{ steps.import_gpg.outputs.keyid }}"
          git config user.name "${{ vars.GIT_USER_NAME }}"
          git config user.email "${{ vars.GIT_USER_EMAIL }}"
      - name: Release
        run: make release
      - name: Push
        id: push
        env:
          RELEASE_TAGS: ${{ needs.generate.outputs.release_tags }}
        run: |
          set -euo pipefail
          # Freshness check: if main moved during verify/generate, this
          # run's release commit is parented on a stale base. Abort
          # cleanly — the push that moved main has already triggered
          # the run that will release everything from the new tip.
          git fetch origin main
          if ! git merge-base --is-ancestor origin/main HEAD; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main moved during the release run; deferring to the successor run"
            exit 0
          fi
          # Atomic: the release commit and this run's tags land
          # together or not at all — a rejected branch push must never
          # leave tags behind.
          refspecs=""
          for t in ${RELEASE_TAGS}; do
            refspecs="${refspecs} refs/tags/${t}:refs/tags/${t}"
          done
          # shellcheck disable=SC2086
          git push --atomic origin HEAD:main ${refspecs}
          echo "pushed=true" >> "$GITHUB_OUTPUT"

  github-release:
    needs: tag
    if: needs.tag.outputs.pushed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include: ${{ fromJSON(needs.tag.outputs.release_json) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ matrix.tag }}
      - name: Environment
        uses: oven-sh/setup-bun@v2
      - name: Install git-cliff
        uses: actions/cache@v4
        id: cliff-cache
        with:
          path: /usr/local/bin/git-cliff
          key: git-cliff-${{ env.GIT_CLIFF_VERSION }}-${{ runner.os }}
      - name: Download git-cliff
        if: steps.cliff-cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL "https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}/git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /tmp
          sudo mv "/tmp/git-cliff-${GIT_CLIFF_VERSION}/git-cliff" /usr/local/bin/git-cliff
      - name: Generate Release Notes
        id: notes
        run: |
          notes=$(make --no-print-directory releasenotes/${{ matrix.package }})
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$notes"
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        env:
          # BOT_TOKEN so the published release emits a release event
          # and triggers publish.yaml; GITHUB_TOKEN-created releases
          # do not (anti-loop protection).
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          gh release create "${{ matrix.tag }}" \
            --title "${{ matrix.tag }}" \
            --notes "${{ steps.notes.outputs.body }}"
