name: Publish

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to publish (e.g. eslint/v0.2.0)'
        required: true
        type: string

permissions:
  contents: read
  # OIDC for npm trusted publishing: the workflow authenticates to the
  # registry with a short-lived credential minted per run — no stored
  # token. Each package registers this repo + workflow as its trusted
  # publisher on npmjs.com.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Tag
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This step runs before checkout, so gh has no git remote to
          # infer the repo from — point it explicitly.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          if ! gh release view "${tag}" --json tagName >/dev/null 2>&1; then
            echo "::error::Release ${tag} not found. Please specify an existing release tag."
            exit 1
          fi
          echo "Validated release: ${tag}"
      - name: Extract Package
        id: extract
        run: |
          tag="${{ steps.release.outputs.tag }}"
          pkg="${tag%%/*}"
          echo "package=${pkg}" >> "$GITHUB_OUTPUT"
          echo "Publishing package: ${pkg} (tag: ${tag})"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
      - name: Environment
        uses: oven-sh/setup-bun@v2
      - name: Environment - Node
        # Trusted publishing needs npm >= 11.5; bun publish does not
        # support OIDC yet (oven-sh/bun#24855), so the publish itself
        # runs through npm while everything else stays on Bun.
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Dependencies
        run: make deps
      - name: Build
        run: make build/${{ steps.extract.outputs.package }}
      - name: Publish NPM
        if: steps.extract.outputs.package != 'vscode'
        # Inline rather than make publish/<pkg>: the checkout is the
        # release tag, whose Makefile may predate the npm/OIDC switch,
        # and trusted publishing only works from this workflow anyway.
        working-directory: packages/${{ steps.extract.outputs.package }}
        run: npm publish
      - name: Publish VS Code Extensions
        if: steps.extract.outputs.package == 'vscode'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: make publish/vscode
